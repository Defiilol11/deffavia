<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Deffavia - Sistema de Reserva de Asientos</title>
    <base href="/" />

    <!-- Viewport y compatibilidad -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Sistema inteligente de gestión y reserva de asientos con visualización en tiempo real. Reserva tu asiento de manera fácil y rápida."
    />
    <meta
      name="keywords"
      content="reserva asientos, gestión asientos, sistema reservas, booking, deffavia"
    />
    <meta name="author" content="Carlos Taracena" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deffavia.com/" />
    <meta property="og:title" content="Deffavia - Sistema de Reserva de Asientos" />
    <meta
      property="og:description"
      content="Sistema inteligente de gestión y reserva de asientos con visualización en tiempo real."
    />
    <meta property="og:image" content="/assets/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://deffavia.com/" />
    <meta property="twitter:title" content="Deffavia - Sistema de Reserva de Asientos" />
    <meta
      property="twitter:description"
      content="Sistema inteligente de gestión y reserva de asientos con visualización en tiempo real."
    />
    <meta property="twitter:image" content="/assets/og-image.jpg" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deffavia" />

    <!-- Fuentes optimizadas con preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Tailwind CSS CDN with custom config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                yellow: '#ffd166',
                pink: '#ef476f',
                purple: '#7c3aed',
              },
            },
            fontFamily: {
              sans: [
                'Inter',
                'system-ui',
                '-apple-system',
                'BlinkMacSystemFont',
                'Segoe UI',
                'Roboto',
                'Helvetica Neue',
                'Arial',
                'sans-serif',
                'Apple Color Emoji',
                'Segoe UI Emoji',
                'Segoe UI Symbol',
              ],
            },
            container: {
              center: true,
              padding: {
                DEFAULT: '1rem',
                sm: '1.5rem',
                md: '2rem',
                lg: '2.5rem',
                xl: '3rem',
              },
              screens: {
                sm: '640px',
                md: '768px',
                lg: '1024px',
                xl: '1280px',
                '2xl': '1536px',
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'slide-up': 'slideUp 0.5s ease-out',
              blob: 'blob 10s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              blob: {
                '0%, 100%': { transform: 'translate(0, 0) scale(1)' },
                '25%': { transform: 'translate(20px, -50px) scale(1.1)' },
                '50%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '75%': { transform: 'translate(50px, 50px) scale(1.05)' },
              },
            },
          },
        },
      };
    </script>

    <!-- Theme initialization (prevent FOUC - Flash of Unstyled Content) -->
    <script>
      (function () {
        try {
          const classList = document.documentElement.classList;
          const storedTheme = localStorage.getItem('theme');
          const prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            classList.add('dark');
          } else {
            classList.remove('dark');
          }
        } catch (error) {
          console.warn('Theme initialization failed:', error);
        }
      })();
    </script>

    <!-- Custom CSS Variables for theming -->
    <style>
      :root {
        /* Light theme (default) */
        --bg: #ffffff;
        --panel: #f9fafb;
        --border: #e5e7eb;
        --text: #111827;
        --text-weak: #6b7280;
        --muted: #9ca3af;

        --accent-yellow: #ffd166;
        --accent-pink: #ef476f;
        --accent-purple: #7c3aed;

        --focus-ring: rgba(124, 58, 237, 0.35);

        --seat-free-bg: #f3f4f6;
        --seat-free-br: #d1d5db;
        --seat-selected-bg: var(--accent-purple);
        --seat-selected-br: #6d28d9;
        --seat-occupied-bg: var(--accent-pink);
        --seat-occupied-br: #be3358;
      }

      .dark {
        /* Dark theme */
        --bg: #0b1020;
        --panel: #0f172a;
        --border: #243041;
        --text: #e5e7eb;
        --text-weak: #a5b4c7;
        --muted: #94a3b8;

        --accent-yellow: #ffd166;
        --accent-pink: #ef476f;
        --accent-purple: #8b5cf6;

        --focus-ring: rgba(139, 92, 246, 0.35);

        --seat-free-bg: #111827;
        --seat-free-br: #374151;
        --seat-selected-bg: var(--accent-purple);
        --seat-selected-br: #6d28d9;
        --seat-occupied-bg: var(--accent-pink);
        --seat-occupied-br: #be3358;
      }

      /* Base styles for html and body */
      html {
        background-color: #ffffff;
        min-height: 100%;
      }

      html.dark {
        background-color: #0b1020;
      }

      body {
        min-height: 100vh;
        background-color: #ffffff;
      }

      body.dark,
      .dark body {
        background-color: #0b1020;
      }

      /* Smooth transitions (respect user preferences) */
      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }

        html,
        body {
          transition: background-color 0.2s ease, color 0.2s ease;
        }
      }

      /* Loading animation */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: var(--panel);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--muted);
        border-radius: 5px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent-purple);
      }

      /* Focus visible styles */
      *:focus-visible {
        outline: 2px solid var(--accent-purple);
        outline-offset: 2px;
      }

      /* App root loading state */
      app-root:empty::before {
        content: '';
        display: block;
        position: fixed;
        top: 50%;
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 4px solid var(--panel);
        border-top-color: var(--accent-purple);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
    </style>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>

  <body
    class="font-sans antialiased bg-white text-gray-900 dark:bg-[#0b1020] dark:text-gray-100 overflow-x-hidden"
  >
    <!-- App root with loading fallback -->
    <app-root></app-root>

    <!-- NoScript fallback -->
    <noscript>
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          padding: 2rem;
          text-align: center;
          background: #0f172a;
          color: white;
        "
      >
        <div>
          <h1 style="font-size: 2rem; font-weight: bold; margin-bottom: 1rem">
            JavaScript Requerido
          </h1>
          <p style="font-size: 1.125rem; color: #94a3b8">
            Por favor habilita JavaScript en tu navegador para usar Deffavia.
          </p>
        </div>
      </div>
    </noscript>
  </body>
</html>
