    <!-- Theme initialization (prevent FOUC - Flash of Unstyled Content) -->
    <script>
      (function () {
        try {
          const classList = document.documentElement.classList;
          const storedTheme = localStorage.getItem('theme');
          const prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

          if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
            classList.add('dark');
          } else {
            classList.remove('dark');
          }
        } catch (error) {
          console.warn('Theme initialization failed:', error);
        }
      })();
    </script>

    <!-- Custom CSS Variables for theming -->
    <style>
      :root {
        /* Light theme (default) */
        --bg: #ffffff;
        --panel: #f9fafb;
        --border: #e5e7eb;
        --text: #111827;
        --text-weak: #6b7280;
        --muted: #9ca3af;

        --accent-yellow: #ffd166;
        --accent-pink: #ef476f;
        --accent-purple: #7c3aed;

        --focus-ring: rgba(124, 58, 237, 0.35);

        --seat-free-bg: #f3f4f6;
        --seat-free-br: #d1d5db;
        --seat-selected-bg: var(--accent-purple);
        --seat-selected-br: #6d28d9;
        --seat-occupied-bg: var(--accent-pink);
        --seat-occupied-br: #be3358;
      }

      .dark {
        /* Dark theme */
        --bg: #0b1020;
        --panel: #0f172a;
        --border: #243041;
        --text: #e5e7eb;
        --text-weak: #a5b4c7;
        --muted: #94a3b8;

        --accent-yellow: #ffd166;
        --accent-pink: #ef476f;
        --accent-purple: #8b5cf6;

        --focus-ring: rgba(139, 92, 246, 0.35);

        --seat-free-bg: #111827;
        --seat-free-br: #374151;
        --seat-selected-bg: var(--accent-purple);
        --seat-selected-br: #6d28d9;
        --seat-occupied-bg: var(--accent-pink);
        --seat-occupied-br: #be3358;
      }

      /* Base styles for html and body */
      html {
        background-color: #ffffff;
        min-height: 100%;
      }

      html.dark {
        background-color: #0b1020;
      }

      body {
        min-height: 100vh;
        background-color: #ffffff;
      }

      body.dark,
      .dark body {
        background-color: #0b1020;
      }

      /* Smooth transitions (respect user preferences) */
      @media (prefers-reduced-motion: no-preference) {
        html {
          scroll-behavior: smooth;
        }

        html,
        body {
          transition: background-color 0.2s ease, color 0.2s ease;
        }
