<div class="zones">
  <!-- Negocios: layout ordenado con separadores -->
  <section class="zone business">
    <h3 class="zone-title">Clase de negocios</h3>
    <div class="grid" [style.--cols]="businessCols.length">
      <!-- Encabezado columnas -->
      <div class="corner"></div>
      <div class="col-label" *ngFor="let c of businessCols; trackBy: trackNum">{{ c }}</div>

      <!-- Filas -->
      <ng-container *ngFor="let r of allRows; trackBy: trackStr">
        <div class="row-label">{{ r }}</div>
        <ng-container *ngIf="hasBusinessRow(r); else businessGhostRow">
          <ng-container *ngFor="let c of businessCols; trackBy: trackNum">
            <button
              class="seat"
              [class.occupied]="getSeat(r, c)?.occupied"
              [class.selected]="getSeat(r, c) && isSelected(getSeat(r, c)!)"
              [class.pickable]="getSeat(r, c) && canPick(getSeat(r, c)!)"
              [class.restricted]="getSeat(r, c) && !isRightClass(getSeat(r, c)!)"
              [disabled]="
                !getSeat(r, c) || getSeat(r, c)!.occupied || !isRightClass(getSeat(r, c)!)
              "
              (click)="onClick(r, c)"
              (dblclick)="onDblClick(r, c)"
              (keydown)="onKeyDown($event, r, c)"
              [attr.aria-pressed]="getSeat(r, c) && isSelected(getSeat(r, c)!) ? 'true' : 'false'"
              [attr.aria-label]="
                'Asiento ' +
                r +
                c +
                (getSeat(r, c)?.occupied
                  ? ' ocupado'
                  : isRightClass(getSeat(r, c)!)
                  ? ''
                  : ' restringido')
              "
              [tabindex]="
                getSeat(r, c) && (canPick(getSeat(r, c)!) || isSelected(getSeat(r, c)!)) ? 0 : -1
              "
              [title]="r + c"
            >
              <span class="seat-headrest"></span>
              <span class="seat-cushion"></span>
              <span class="seat-arms">
                <span class="arm left"></span>
                <span class="arm right"></span>
              </span>
              <span class="seat-code">{{ r + c }}</span>
            </button>
          </ng-container>
        </ng-container>
        <ng-template #businessGhostRow>
          <ng-container *ngFor="let c of businessCols; trackBy: trackNum">
            <div class="seat ghost" aria-hidden="true"></div>
          </ng-container>
        </ng-template>

        <!-- Separador entre subgrupos -->
        <div class="row-separator" *ngIf="sepAfterBusinessRow(r)"></div>
      </ng-container>
    </div>
  </section>

  <!-- Económica: layout ordenado con separadores -->
  <section class="zone economy">
    <h3 class="zone-title">Clase económica</h3>
    <div class="grid" [style.--cols]="economyCols.length">
      <!-- Encabezado columnas -->
      <div class="corner"></div>
      <div class="col-label" *ngFor="let c of economyCols; trackBy: trackNum">{{ c }}</div>

      <!-- Filas -->
      <ng-container *ngFor="let r of economyRows; trackBy: trackStr">
        <div class="row-label">{{ r }}</div>
        <ng-container *ngFor="let c of economyCols; trackBy: trackNum">
          <button
            class="seat"
            [class.occupied]="getSeat(r, c)?.occupied"
            [class.selected]="getSeat(r, c) && isSelected(getSeat(r, c)!)"
            [class.pickable]="getSeat(r, c) && canPick(getSeat(r, c)!)"
            [class.restricted]="getSeat(r, c) && !isRightClass(getSeat(r, c)!)"
            [disabled]="!getSeat(r, c) || getSeat(r, c)!.occupied || !isRightClass(getSeat(r, c)!)"
            (click)="onClick(r, c)"
            (dblclick)="onDblClick(r, c)"
            (keydown)="onKeyDown($event, r, c)"
            [attr.aria-pressed]="getSeat(r, c) && isSelected(getSeat(r, c)!) ? 'true' : 'false'"
            [attr.aria-label]="
              'Asiento ' +
              r +
              c +
              (getSeat(r, c)?.occupied
                ? ' ocupado'
                : isRightClass(getSeat(r, c)!)
                ? ''
                : ' restringido')
            "
            [tabindex]="
              getSeat(r, c) && (canPick(getSeat(r, c)!) || isSelected(getSeat(r, c)!)) ? 0 : -1
            "
            [title]="r + c"
          >
            <span class="seat-headrest"></span>
            <span class="seat-cushion"></span>
            <span class="seat-arms">
              <span class="arm left"></span>
              <span class="arm right"></span>
            </span>
            <span class="seat-code">{{ r + c }}</span>
          </button>
        </ng-container>

        <!-- Separador entre subgrupos -->
        <div class="row-separator" *ngIf="sepAfterEconomyRow(r)"></div>
      </ng-container>
    </div>
  </section>
</div>

<!-- Leyenda e instrucciones (debajo, compacto y sin panel) -->
<div
  class="mt-3 border-t border-zinc-200 pt-3 text-xs text-zinc-600 dark:border-zinc-800 dark:text-zinc-300"
>
  <div>
    <ng-container *ngIf="pickMode; else viewOnly">
      Selecciona hasta <b>{{ maxSelection }}</b> asiento(s)
      <ng-container *ngIf="seatClass"
        >en clase <b>{{ seatClass }}</b></ng-container
      >.
    </ng-container>
    <ng-template #viewOnly>Vista del mapa de asientos.</ng-template>
  </div>
  <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-2">
    <span class="inline-flex items-center gap-1">
      <span
        class="h-2.5 w-2.5 rounded-full bg-zinc-400 ring-1 ring-inset ring-zinc-400/30 dark:bg-zinc-500"
      ></span>
      Disponible
    </span>
    <span class="inline-flex items-center gap-1">
      <span
        class="h-2.5 w-2.5 rounded-full bg-violet-600 ring-1 ring-inset ring-violet-600/30"
      ></span>
      Seleccionado
    </span>
    <span class="inline-flex items-center gap-1">
      <span class="h-2.5 w-2.5 rounded-full bg-rose-600 ring-1 ring-inset ring-rose-600/30"></span>
      Ocupado
    </span>
    <span class="inline-flex items-center gap-1">
      <span class="h-2.5 w-2.5 rounded-full bg-zinc-500 ring-1 ring-inset ring-zinc-500/30"></span>
      Restringido
    </span>
  </div>
</div>
